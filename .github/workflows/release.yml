name: Build and Release

permissions: write-all

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not let one platform's failure/cancellation abort the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MRI-Reader-Windows
            asset_name: MRI-Reader-Windows.zip
          - os: ubuntu-latest
            artifact_name: MRI-Reader-Linux
            asset_name: MRI-Reader-Linux.tar.gz
          - os: macos-latest
            artifact_name: MRI-Reader-macOS
            asset_name: MRI-Reader-macOS.zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller

    - name: Build executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller build.spec --clean --noconfirm
      shell: bash

    - name: Build executable (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller build.spec --clean --noconfirm

    - name: Build executable (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller build.spec --clean --noconfirm

    - name: Package artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd dist
        7z a -tzip ../${{ matrix.asset_name }} MRI-Reader/
      shell: bash

    - name: Package artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd dist
        tar -czf ../${{ matrix.asset_name }} MRI-Reader/

    - name: Package artifact (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r ../${{ matrix.asset_name }} MRI-Reader/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.asset_name }}
        retention-days: 5

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # ``always()`` keeps the release alive when one platform's build was
    # cancelled by a GitHub runner-capacity incident: whatever artifacts did
    # finish still get published, and a re-run of a failed platform updates
    # the same release.  Without it a single flaky runner blocks the release
    # entirely (this actually happened on the v0.3.0 run).
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
      continue-on-error: true

    - name: List downloaded artifacts
      run: find artifacts -type f 2>/dev/null || echo "(no artifacts downloaded)"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        # A tag push supplies github.ref_name; the manual dispatch supplies the
        # version input.  Previously the manual path could never publish because
        # this step was gated on refs/tags/ only.
        tag_name: ${{ github.event.inputs.release_version || github.ref_name }}
        files: |
          artifacts/MRI-Reader-Windows/MRI-Reader-Windows.zip
          artifacts/MRI-Reader-Linux/MRI-Reader-Linux.tar.gz
          artifacts/MRI-Reader-macOS/MRI-Reader-macOS.zip
        # Tolerate a platform whose runner was unavailable instead of failing.
        fail_on_unmatched_files: false
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
