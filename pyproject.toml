[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-reader"
version = "0.3.0"
description = "A MRI image reading and viewing tool with Qt-based GUI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pillow>=9.0.0",
    "h5py>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "black>=24.0",
]

[project.scripts]
mri-reader = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "perf: performance-budget tests (slow; require the large local fixture)",
    "gui: tests that construct Qt widgets (headless via QT_QPA_PLATFORM=offscreen)",
]
filterwarnings = [
    "ignore::DeprecationWarning:PyQt5.*",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".artifacts", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests manipulate sys.path before importing the package.
"tests/**" = ["E402"]
"test_core.py" = ["E402"]
"verify.py" = ["E402"]
"generate_test_data.py" = ["E402"]
